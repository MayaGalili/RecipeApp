  <script>
        // Language translations
        const translations = {
            he: {
                recipe_title: "בונה רשימת קניות",
                subtitle: "בחר מתכון ומספר מנות וקבל רשימת קניות מותאמת",
                recipe_selector_title: "בחר מתכון",
                serving_selector_title: "בחר מספר מנות",
                serving_label: "מנות",
                ingredients_title: "מרכיבי המתכון",
                instructions_title: "הוראות הכנה",
                shopping_list_title: "רשימת קניות",
                print_text: "🖨️ הדפס רשימת קניות",
                reset_text: "🔄 איפוס סימונים",
                servings_text: "מנות"
            },
            en: {
                recipe_title: "Shopping List Builder",
                subtitle: "Choose a recipe and serving size to get a customized shopping list",
                recipe_selector_title: "Choose Recipe",
                serving_selector_title: "Choose Serving Size",
                serving_label: "servings",
                ingredients_title: "Recipe Ingredients",
                instructions_title: "Instructions",
                shopping_list_title: "Shopping List",
                print_text: "🖨️ Print Shopping List",
                reset_text: "🔄 Reset Selections",
                servings_text: "servings"
            }
        };

        let currentLanguage = 'he';

        // Default configuration
        const defaultConfig = {
            recipe_title: "בונה רשימת קניות",
            serving_label: "מנות",
            shopping_list_title: "רשימת קניות",
            background_color: "#fef7f0",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#ef4444",
            secondary_action_color: "#3b82f6",
            font_family: "Segoe UI",
            font_size: 16
        };

        // Recipe categories
        const recipeCategories = {
            he: {
                meat_fish: "בשר/דגים",
                pasta_sauces: "פסטה ורטבים",
                sides: "תוספות",
                salads: "סלטים",
                soups: "מרקים",
                desserts: "קינוחים",
                holidays: "חגים וחגיגות"
            },
            en: {
                meat_fish: "Meat/Fish",
                pasta_sauces: "Pasta & Sauces",
                sides: "Sides",
                salads: "Salads",
                soups: "Soups",
                desserts: "Desserts",
                holidays: "Holidays & Celebrations"
            }
        };

        // Recipe database with translations and categories
        // Recipe data will be loaded from external JSON file
        let recipes = {};
        let recipeTranslations = {};
        let recipeCategoryMap = {};

        // Load recipes from external JSON file
        async function loadRecipes() {
            try {
                const response = await fetch('recipes.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                recipes = data.recipes;
                recipeTranslations = data.recipeTranslations;
                recipeCategoryMap = data.recipeCategoryMap;
                
                // Initialize app after recipes are loaded
                initializeApp();
            } catch (error) {
                console.error('Error loading recipes:', error);
                // Show error message to user
                document.body.innerHTML = '<div class="p-8 text-center"><h1 class="text-2xl font-bold text-red-600">Error loading recipes</h1><p class="mt-4 text-gray-600">Please make sure recipes.json file exists and is accessible.</p></div>';
            }
        }

        let currentServings = 4;
        let currentRecipe = 'pancakes';

        // Initialize the application after recipes are loaded
        function initializeApp() {
            // Initialize the UI
            createRecipeSelector();
            updateAll();
        }

        // Language switching function
        function switchLanguage(lang) {
            currentLanguage = lang;
           
            // Update language button states
            document.querySelectorAll('.language-btn').forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 bg-orange-500 text-white';
                } else {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 text-gray-600 hover:bg-gray-100';
                }
            });

            // Update page direction
            const html = document.documentElement;
            if (lang === 'he') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', lang);
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', lang);
            }

            // Update all text elements
            updateLanguageTexts();
        }

        // Update all text elements based on current language
        function updateLanguageTexts() {
            const t = translations[currentLanguage];
           
            document.getElementById('recipe-title').textContent = t.recipe_title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('recipe-selector-title').textContent = t.recipe_selector_title;
            document.getElementById('serving-selector-title').textContent = t.serving_selector_title;
            document.getElementById('serving-label').textContent = t.serving_label;
            document.getElementById('ingredients-title').textContent = t.ingredients_title;
            document.getElementById('instructions-title').textContent = t.instructions_title;
            document.getElementById('shopping-list-title').textContent = t.shopping_list_title;
            document.getElementById('print-text').textContent = t.print_text;
            document.getElementById('reset-text').textContent = t.reset_text;
           
            // Update preset buttons
            updatePresetButtons();
           
            // Update recipe selector
            updateRecipeSelector();
           
            // Update all content
            updateAll();
        }

        // Update preset buttons with current language
        function updatePresetButtons() {
            const t = translations[currentLanguage];
            const presetButtons = document.querySelectorAll('.preset-serving-btn');
            presetButtons.forEach(btn => {
                const servings = parseInt(btn.dataset.servings);
                btn.textContent = `${servings} ${t.serving_label}`;
            });
        }

        // Calculate scaled amount
        function scaleAmount(amount, servings) {
            return (amount * servings) / 4;
        }

        // Format amount for display
        function formatAmount(amount) {
            if (amount % 1 === 0) {
                return amount.toString();
            } else if (amount % 0.5 === 0) {
                return amount.toString();
            } else if (amount % 0.25 === 0) {
                return amount.toString();
            } else {
                return amount.toFixed(1);
            }
        }

        // Create recipe selector buttons organized by categories
        function createRecipeSelector() {
            const recipeSelector = document.getElementById('recipe-selector');
            recipeSelector.innerHTML = '';

            // Create categories
            Object.keys(recipeCategoryMap).forEach(categoryKey => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category-section';
               
                // Category title
                const categoryTitle = document.createElement('div');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = recipeCategories[currentLanguage][categoryKey];
                categoryDiv.appendChild(categoryTitle);
               
                // Recipe buttons grid
                const recipesGrid = document.createElement('div');
                recipesGrid.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3';
               
                recipeCategoryMap[categoryKey].forEach(recipeKey => {
                    const recipe = recipes[recipeKey];
                    const button = document.createElement('button');
                    button.className = `recipe-button p-4 bg-white border-2 border-gray-200 rounded-lg text-center hover:border-orange-300 ${recipeKey === currentRecipe ? 'active' : ''}`;
                    button.innerHTML = `
                        <div class="text-3xl mb-2">${recipe.emoji}</div>
                        <div class="text-sm font-medium text-gray-700">${recipeTranslations[currentLanguage][recipeKey]}</div>
                    `;
                    button.addEventListener('click', () => {
                        currentRecipe = recipeKey;
                        updateRecipeDisplay();
                        createRecipeSelector();
                    });
                    recipesGrid.appendChild(button);
                });
               
                categoryDiv.appendChild(recipesGrid);
                recipeSelector.appendChild(categoryDiv);
            });
        }

        // Update recipe display
        function updateRecipeDisplay() {
            updateAll();
        }

        // Language switching function
        function switchLanguage(lang) {
            currentLanguage = lang;
           
            // Update language button states
            document.querySelectorAll('.language-btn').forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 bg-orange-500 text-white';
                } else {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 text-gray-600 hover:bg-gray-100';
                }
            });

            // Update page direction
            const html = document.documentElement;
            if (lang === 'he') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', lang);

                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', lang);
            }

            // Update all text elements
            updateLanguageTexts();
        }

        // Update all text elements based on current language
        function updateLanguageTexts() {
            const t = translations[currentLanguage];
           
            document.getElementById('recipe-title').textContent = t.recipe_title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('recipe-selector-title').textContent = t.recipe_selector_title;

            // Update preset buttons

        // Update preset buttons with current language
        function updatePresetButtons() {
            const t = translations[currentLanguage];
            const presetButtons = document.querySelectorAll('.preset-btn');
            presetButtons.forEach(btn => {
                const servings = btn.dataset.servings;
                btn.textContent = `${servings} ${t.servings_text}`;
            });

        // Calculate scaled amount
        function scaleAmount(baseAmount, servings) {
            const scaleFactor = servings / 4;
            const scaledAmount = baseAmount * scaleFactor;
           
            // Round to reasonable precision
            if (scaledAmount < 1) {
                return Math.round(scaledAmount * 10) / 10;
            } else if (scaledAmount < 10) {
                return Math.round(scaledAmount * 4) / 4;
            } else {
                return Math.round(scaledAmount * 2) / 2;
            }
        }

        // Format amount for display
        function formatAmount(amount) {
            if (amount % 1 === 0) {
                return amount.toString();
            } else if (amount % 0.5 === 0) {
                return amount.toString();
            } else if (amount % 0.25 === 0) {
                return amount.toString();
            } else {
                return amount.toFixed(1);
            }
        }

        // Create recipe selector buttons organized by categories
        function createRecipeSelector() {
            const recipeSelector = document.getElementById('recipe-selector');
            recipeSelector.innerHTML = '';

            // Create categories
            Object.keys(recipeCategoryMap).forEach(categoryKey => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category-section';
               
                // Category title
                const categoryTitle = document.createElement('div');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = recipeCategories[currentLanguage][categoryKey];
                categoryDiv.appendChild(categoryTitle);
               
                // Recipe buttons grid
                const recipesGrid = document.createElement('div');
                recipesGrid.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3';
               
                recipeCategoryMap[categoryKey].forEach(recipeKey => {
                    const recipe = recipes[recipeKey];

                    button.className = `recipe-button p-4 bg-white border-2 border-gray-200 rounded-lg text-center hover:border-orange-300 ${recipeKey === currentRecipe ? 'active' : ''}`;
                    button.innerHTML = `

                    `;

                        updateRecipeSelector();

                    recipesGrid.appendChild(button);

                categoryDiv.appendChild(recipesGrid);
                recipeSelector.appendChild(categoryDiv);

        // Update recipe selector active state
        function updateRecipeSelector() {

        // Update ingredients display
        function updateIngredients() {
            const ingredientsList = document.getElementById('ingredients-list');
            ingredientsList.innerHTML = '';

            const recipe = recipes[currentRecipe];
            const ingredients = recipe.ingredients[currentLanguage] || recipe.ingredients.he;
           
            ingredients.forEach((ingredient, index) => {
                const scaledAmount = scaleAmount(ingredient.amount, currentServings);
                const ingredientDiv = document.createElement('div');
                ingredientDiv.className = 'ingredient-item flex justify-between items-center p-3 bg-gray-50 rounded-lg';
                ingredientDiv.innerHTML = `

                `;

        // Update instructions display
        function updateInstructions() {
            const instructionsList = document.getElementById('instructions-list');

        // Update shopping list
        function updateShoppingList() {
            const shoppingList = document.getElementById('shopping-list');
            shoppingList.innerHTML = '';

            const recipe = recipes[currentRecipe];
            const ingredients = recipe.ingredients[currentLanguage] || recipe.ingredients.he;
           
            // Group ingredients by category
            const categories = {};
            ingredients.forEach((ingredient, index) => {
                if (!categories[ingredient.category]) {
                    categories[ingredient.category] = [];
                }
                const scaledAmount = scaleAmount(ingredient.amount, currentServings);
                categories[ingredient.category].push({
                    name: ingredient.name,
                    amount: scaledAmount,
                    unit: ingredient.unit,
                    id: `item-${currentRecipe}-${index}`
                });
            });

            // Display by categories
            Object.keys(categories).forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-4';
               
                const categoryTitle = document.createElement('h3');

                categories[category].forEach(item => {

                    const checkboxMargin = (currentLanguage === 'he') ? 'ml-3' : 'mr-3';

        // Element SDK implementation
        async function onConfigChange(config) {
            const customFont = config.font_family || defaultConfig.font_family;
            const baseFontStack = 'Tahoma, Geneva, Verdana, sans-serif';
            const baseSize = config.font_size || defaultConfig.font_size;
           
            // Update colors
            document.body.style.background = `linear-gradient(to bottom right, ${config.background_color || defaultConfig.background_color}, #fef2f2)`;
           
            // Update surface colors
            document.querySelectorAll('.bg-white').forEach(el => {
                el.style.backgroundColor = config.surface_color || defaultConfig.surface_color;
            });
           
            // Update text colors
            document.querySelectorAll('.text-gray-800').forEach(el => {
                el.style.color = config.text_color || defaultConfig.text_color;
            });
           
            // Update primary action colors
            document.getElementById('decrease-btn').style.backgroundColor = config.primary_action_color || defaultConfig.primary_action_color;
            document.getElementById('increase-btn').style.backgroundColor = '#10b981';
           
            // Update secondary action colors
            document.getElementById('print-btn').style.backgroundColor = config.secondary_action_color || defaultConfig.secondary_action_color;
           
            // Update fonts
            document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;
           
            // Update font sizes
            document.getElementById('recipe-title').style.fontSize = `${baseSize * 2}px`;
            document.querySelectorAll('h2').forEach(el => {
                el.style.fontSize = `${baseSize * 1.5}px`;
            });
            document.body.style.fontSize = `${baseSize}px`;
           
            // Update text content
            document.getElementById('recipe-title').textContent = config.recipe_title || defaultConfig.recipe_title;
            document.getElementById('serving-label').textContent = config.serving_label || defaultConfig.serving_label;
            document.getElementById('shopping-list-title').textContent = config.shopping_list_title || defaultConfig.shopping_list_title;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [
                    {
                        get: () => config.background_color || defaultConfig.background_color,
                        set: (value) => {
                            config.background_color = value;
                            window.elementSdk.setConfig({ background_color: value });
                        }
                    },
                    {

        function mapToEditPanelValues(config) {

        // Initialize Element SDK
        if (window.elementSdk) {

        // Parse ingredients from textarea
        function parseIngredients(text, lang) {
            if (!text.trim()) return [];
            const lines = text.split('\n').filter(line => line.trim());
            return lines.map(line => {
                const parts = line.split(',').map(p => p.trim());
                if (parts.length >= 4) {
                    return {
                        name: parts[0],
                        amount: parseFloat(parts[1]),
                        unit: parts[2],
                        category: parts[3]
                    };
                }
                return null;
            }).filter(item => item !== null);
        }

        // Parse instructions from textarea
        function parseInstructions(text) {
            if (!text.trim()) return [];
            return text.split('\n').filter(line => line.trim());
        }

        // Generate recipe key from English name
        function generateRecipeKey(recipeNameEn) {
            if (!recipeNameEn) return '';
            
            // Convert to lowercase, replace spaces and special chars with underscores
            let key = recipeNameEn
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s]/g, '') // Remove special characters
                .replace(/\s+/g, '_') // Replace spaces with underscores
                .replace(/_+/g, '_') // Replace multiple underscores with single
                .replace(/^_|_$/g, ''); // Remove leading/trailing underscores
            
            // If key is empty, use a default
            if (!key) {
                key = 'recipe';
            }
            
            // Check if key already exists, if so add a number suffix
            let finalKey = key;
            let counter = 1;
            while (recipes[finalKey]) {
                finalKey = `${key}_${counter}`;
                counter++;
            }
            
            return finalKey;
        }

        // Handle recipe form submission
        async function handleRecipeSubmit(event) {
            event.preventDefault();
            
            const formMessage = document.getElementById('form-message');
            formMessage.classList.add('hidden');
            
            const recipeNameHe = document.getElementById('recipe-name-he').value.trim();
            const recipeNameEn = document.getElementById('recipe-name-en').value.trim();
            const emoji = document.getElementById('recipe-emoji').value.trim();
            const category = document.getElementById('recipe-category').value;
            const ingredientsHe = parseIngredients(document.getElementById('ingredients-he').value, 'he');
            const ingredientsEn = parseIngredients(document.getElementById('ingredients-en').value, 'en');
            const instructionsHe = parseInstructions(document.getElementById('instructions-he').value);
            const instructionsEn = parseInstructions(document.getElementById('instructions-en').value);

            // Validate
            if (!recipeNameHe || !recipeNameEn || !emoji || !category) {
                showFormMessage('אנא מלא את כל השדות הנדרשים', 'error');
                return;
            }

            // Generate recipe key automatically
            const recipeKey = generateRecipeKey(recipeNameEn);

            if (ingredientsHe.length === 0 || ingredientsEn.length === 0) {
                showFormMessage('אנא הוסף לפחות מרכיב אחד בכל שפה', 'error');
                return;
            }

            // Create recipe object
            const newRecipe = {
                name: `${emoji} ${recipeNameHe}`,
                emoji: emoji,
                ingredients: {
                    he: ingredientsHe,
                    en: ingredientsEn
                },
                instructions: {
                    he: instructionsHe,
                    en: instructionsEn
                }
            };

            // Send to server
            try {
                const response = await fetch('/api/add-recipe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipeKey: recipeKey,
                        recipe: newRecipe,
                        category: category,
                        translations: {
                            he: recipeNameHe,
                            en: recipeNameEn
                        }
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save recipe');
                }

                // Reload recipes and update UI
                await loadRecipes();
                showFormMessage('המתכון נוסף בהצלחה!', 'success');
                
                // Reset form
                document.getElementById('recipe-form').reset();
                document.getElementById('add-recipe-form').classList.add('hidden');
                
                // Switch to the new recipe
                currentRecipe = recipeKey;
                updateRecipeSelector();
                updateAll();
                
            } catch (error) {
                console.error('Error saving recipe:', error);
                showFormMessage(`שגיאה בשמירת המתכון: ${error.message}`, 'error');
            }
        }

        // Show form message
        function showFormMessage(message, type) {
            const formMessage = document.getElementById('form-message');
            formMessage.textContent = message;
            formMessage.className = `mt-4 p-4 rounded-lg ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            formMessage.classList.remove('hidden');
        }

        // Toggle form visibility
        function toggleForm() {
            const form = document.getElementById('add-recipe-form');
            form.classList.toggle('hidden');
        }

        // Initialize form event listeners
        function initializeFormListeners() {
            const toggleBtn = document.getElementById('toggle-form-btn');
            const cancelBtn = document.getElementById('cancel-form-btn');
            const recipeForm = document.getElementById('recipe-form');

            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleForm);
            }
            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    document.getElementById('add-recipe-form').classList.add('hidden');
                    document.getElementById('recipe-form').reset();
                    document.getElementById('form-message').classList.add('hidden');
                });
            }
            if (recipeForm) {
                recipeForm.addEventListener('submit', handleRecipeSubmit);
            }
        }

        // Language button event listeners
        document.querySelectorAll('.language-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchLanguage(btn.dataset.lang);
            });
        });

        // Initialize the app
        // Load recipes when page loads
        loadRecipes();
        
        // Initialize form listeners after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeFormListeners);
        } else {
            initializeFormListeners();
        }
    </script>
