<!doctype html>
<html lang="he" dir="rtl" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מתכונים ונהנים</title>
  <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="min-h-full bg-gradient-to-br from-orange-50 to-red-50">
  <div class="container mx-auto px-4 py-8 max-w-4xl"><!-- Language Selector -->
   <div class="text-center mb-6">
    <div class="inline-flex bg-white rounded-lg shadow-md p-1"><button id="lang-he" class="language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 bg-orange-500 text-white" data-lang="he">עברית</button> <button id="lang-en" class="language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 text-gray-600 hover:bg-gray-100" data-lang="en">English</button>
    </div>
   </div><!-- Header -->
   <div class="text-center mb-8">
    <h1 id="recipe-title" class="text-4xl font-bold text-gray-800 mb-2">מתכונים ונהנים</h1>
    <p id="subtitle" class="text-gray-600 text-lg">בחר מתכון אחד או יותר וקבל רשימת קניות מאוחדת</p>
   </div><!-- Recipe Selector -->
   <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
    <h2 id="recipe-selector-title" class="text-2xl font-semibold text-gray-800 mb-4 text-center">בחר מתכון</h2>
    <input type="search" id="recipe-search" class="w-full mb-4 px-4 py-2 border-2 border-gray-200 rounded-lg shadow-md focus:border-orange-500" placeholder="חיפוש מתכון לפי שם" aria-label="חיפוש מתכון לפי שם" autocomplete="off">
    <div id="recipe-selector"><!-- Recipe categories will be populated by JavaScript -->
    </div>
   </div><!-- Navigation to Manage Page -->
   <div class="text-center mb-8">
    <a href="{{ url_for('manage') }}" id="manage-recipes-btn" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 shadow-md text-2xl" title="ניהול מתכונים">✍🏻</a>
   </div><!-- Selected Recipes -->
   <div id="selected-recipes-panel" class="bg-white rounded-xl shadow-lg p-6 mb-8">
    <h2 id="selected-recipes-title" class="text-2xl font-semibold text-gray-800 mb-4 text-center">מתכונים שנבחרו</h2>
    <p id="selected-recipes-empty" class="text-center text-gray-500 mb-4">סמנו מתכונים כדי להוסיף אותם לרשימת הקניות</p>
    <div id="selected-recipes-list" class="space-y-2 mb-4"><!-- Selected recipes will be populated by JavaScript -->
    </div>
    <div class="flex gap-3 flex-wrap">
      <button id="generate-list-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 px-6 rounded-lg font-medium shadow-md transition-colors min-w-[150px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-green-500" disabled>
        <span id="generate-list-text">🛒 צור רשימת קניות</span>
      </button>
      <button id="clear-selection-btn" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 px-6 rounded-lg font-medium shadow-md transition-colors min-w-[150px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-gray-500" disabled>
        <span id="clear-selection-text">🗑️ נקה בחירה</span>
      </button>
    </div>
   </div><!-- Recipe Ingredients -->
   <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
    <h2 id="ingredients-title" class="text-2xl font-semibold text-gray-800 mb-6">מרכיבי המתכון</h2>
    <div id="ingredients-list" class="space-y-3"><!-- Ingredients will be populated by JavaScript -->
    </div>
   </div><!-- Recipe Instructions -->
   <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
    <h2 id="instructions-title" class="text-2xl font-semibold text-gray-800 mb-6">הוראות הכנה</h2>
    <div id="instructions-list" class="space-y-3"><!-- Instructions will be populated by JavaScript -->
    </div>
   </div><!-- Shopping List -->
   <div id="shopping-list-card" class="bg-white rounded-xl shadow-lg p-6" style="display: none;">
    <h2 id="shopping-list-title" class="text-2xl font-semibold text-gray-800 mb-6">רשימת קניות</h2>
    <div id="shopping-list" class="space-y-2"><!-- Shopping list will be populated by JavaScript -->
    </div>
    <div class="mt-6 flex gap-3 flex-wrap">
      <button id="print-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-3 px-6 rounded-lg font-medium shadow-md transition-colors min-w-[150px]">
        <span id="print-text">🖨️ הדפס רשימת קניות</span>
      </button>
      <button id="copy-clipboard-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 px-6 rounded-lg font-medium shadow-md transition-colors min-w-[150px]">
        <span id="copy-clipboard-text">📋 העתק ללוח</span>
      </button>
      <button id="reset-btn" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 px-6 rounded-lg font-medium shadow-md transition-colors min-w-[150px]">
        <span id="reset-text">🔄 איפוס סימונים</span>
      </button>
    </div>
   </div>
  </div>
  <script>
    // Server-generated URLs for the scripts below
    window.APP_CONFIG = {
      recipes: {{ url_for("serve_recipes")|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/index-i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shopping-list-aggregate.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-recipe-view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-multi-recipe.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-actions.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-share.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-init.js') }}"></script>

</html>
