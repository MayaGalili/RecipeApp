<!doctype html>
<html lang="he" dir="rtl" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מתכונים ונהנים</title>
  <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
        body {
            box-sizing: border-box;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
       
        .ingredient-item {
            transition: all 0.2s ease;
        }
       
        .ingredient-item:hover {
            transform: translateX(-2px);
        }
       
        .serving-button {
            transition: all 0.2s ease;
        }
       
        .serving-button:hover {
            transform: scale(1.05);
        }
       
        .recipe-button {
            transition: all 0.2s ease;
        }
       
        .recipe-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
       
        .recipe-button.active {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            transform: scale(1.02);
        }
       
        .shopping-item {
            transition: all 0.2s ease;
        }
       
        .shopping-item:hover {
            background-color: #f8fafc;
        }
       
        .category-section {
            margin-bottom: 2rem;
        }
       
        .category-title {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }
       
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
       
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fall {
            from {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .falling-emoji {
            position: fixed;
            font-size: 3rem;
            pointer-events: none;
            z-index: 9999;
            animation: fall 3s linear forwards;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

    <div class="mt-6 flex gap-3 flex-wrap">

      <button id="copy-clipboard-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 px-6 rounded-lg font-medium shadow-md transition-colors min-w-[150px]">

  <script>
        // Language translations
        const translations = {
            he: {
                recipe_title: "מתכונים ונהנים",
                subtitle: "בחר מתכון ומספר מנות וקבל רשימת קניות מותאמת",
                recipe_selector_title: "בחר מתכון",
                serving_selector_title: "בחר מספר מנות",
                serving_label: "מנות",
                ingredients_title: "מרכיבי המתכון",
                instructions_title: "הוראות הכנה",
                shopping_list_title: "רשימת קניות",
                print_text: "🖨️ הדפס רשימת קניות",
                copy_clipboard_text: "📋 העתק ללוח",
                reset_text: "🔄 איפוס סימונים",
                servings_text: "מנות"
            },
            en: {
                recipe_title: "Recipes & Enjoy",
                subtitle: "Choose a recipe and serving size to get a customized shopping list",
                recipe_selector_title: "Choose Recipe",
                serving_selector_title: "Choose Serving Size",
                serving_label: "servings",
                ingredients_title: "Recipe Ingredients",
                instructions_title: "Instructions",
                shopping_list_title: "Shopping List",
                print_text: "🖨️ Print Shopping List",
                copy_clipboard_text: "📋 Copy to Clipboard",
                reset_text: "🔄 Reset Selections",
                servings_text: "servings"
            }
        };

        let currentLanguage = 'he';

        // API endpoints (from Flask url_for)
        const API_ENDPOINTS = {
            recipes: '{{ url_for("serve_recipes") }}'
        };

        // Recipe categories
        const recipeCategories = {
            he: {
                meat_fish: "בשר/דגים",
                pasta_sauces: "פסטה ורטבים",
                sides: "תוספות",
                salads: "סלטים",
                soups: "מרקים",
                desserts: "קינוחים",
                holidays: "חגים וחגיגות"
            },
            en: {
                meat_fish: "Meat/Fish",
                pasta_sauces: "Pasta & Sauces",
                sides: "Sides",
                salads: "Salads",
                soups: "Soups",
                desserts: "Desserts",
                holidays: "Holidays & Celebrations"
            }
        };

        // Recipe database with translations and categories
        // Recipe data will be loaded from external JSON file
        let recipes = {};
        let recipeTranslations = {};
        let recipeCategoryMap = {};

        // Load recipes from external JSON file
        async function loadRecipes() {
            try {
                const response = await fetch(API_ENDPOINTS.recipes);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (!data.recipes || !data.recipeTranslations || !data.recipeCategoryMap) {
                    throw new Error('Invalid recipes.json structure');
                }
                
                recipes = data.recipes;
                recipeTranslations = data.recipeTranslations;
                recipeCategoryMap = data.recipeCategoryMap;
                
                // Initialize app after recipes are loaded
                initializeApp();
            } catch (error) {
                console.error('Error loading recipes:', error);
                // Show error message to user with more details
                const errorMsg = error.message || 'Unknown error';
                document.body.innerHTML = `
                    <div class="p-8 text-center">
                        <h1 class="text-2xl font-bold text-red-600 mb-4">Error loading recipes</h1>
                        <p class="mt-4 text-gray-600 mb-2">Please make sure recipes.json file exists and is accessible.</p>
                        <p class="text-sm text-gray-500">Error: ${errorMsg}</p>
                        <p class="mt-4 text-sm text-gray-500">Make sure the Flask server is running on http://localhost:5001</p>
                    </div>
                `;
            }
        }

        let currentServings = 4;
        let currentRecipe = null; // Will be set after recipes load

        // Initialize the application after recipes are loaded
        function initializeApp() {
            // Set default recipe if not set
            if (!currentRecipe || !recipes[currentRecipe]) {
                // Get the first available recipe from any category
                const firstCategory = Object.keys(recipeCategoryMap)[0];
                if (firstCategory && recipeCategoryMap[firstCategory].length > 0) {
                    currentRecipe = recipeCategoryMap[firstCategory][0];
                } else {
                    // Fallback: get first recipe from recipes object
                    const recipeKeys = Object.keys(recipes);
                    if (recipeKeys.length > 0) {
                        currentRecipe = recipeKeys[0];
                    }
                }
            }
            
            // Initialize the UI
            createRecipeSelector();
            updateAll();
        }

        // Language switching function
        function switchLanguage(lang) {
            currentLanguage = lang;
           
            // Update language button states
            document.querySelectorAll('.language-btn').forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 bg-orange-500 text-white';
                } else {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 text-gray-600 hover:bg-gray-100';
                }
            });

            // Update page direction
            const html = document.documentElement;
            if (lang === 'he') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', lang);
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', lang);
            }

            // Update all text elements
            updateLanguageTexts();
        }

        // Update all text elements based on current language
        function updateLanguageTexts() {
            const t = translations[currentLanguage];
           
            document.getElementById('recipe-title').textContent = t.recipe_title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('recipe-selector-title').textContent = t.recipe_selector_title;
            document.getElementById('serving-selector-title').textContent = t.serving_selector_title;
            document.getElementById('serving-label').textContent = t.serving_label;
            document.getElementById('ingredients-title').textContent = t.ingredients_title;
            document.getElementById('instructions-title').textContent = t.instructions_title;
            document.getElementById('shopping-list-title').textContent = t.shopping_list_title;
            document.getElementById('print-text').textContent = t.print_text;
            document.getElementById('copy-clipboard-text').textContent = t.copy_clipboard_text;
            document.getElementById('reset-text').textContent = t.reset_text;
           
            // Update preset buttons
            updatePresetButtons();
           
            // Update recipe selector
            updateRecipeSelector();
           
            // Update all content
            updateAll();
        }

        // Update preset buttons with current language
        function updatePresetButtons() {
            const t = translations[currentLanguage];
            const presetButtons = document.querySelectorAll('.preset-serving-btn');
            presetButtons.forEach(btn => {
                const servings = parseInt(btn.dataset.servings);
                btn.textContent = `${servings} ${t.serving_label}`;
            });
        }

        // Calculate scaled amount
        function scaleAmount(amount, servings) {
            return (amount * servings) / 4;
        }

        // Format amount for display
        function formatAmount(amount) {
            if (amount % 1 === 0) {
                return amount.toString();
            } else if (amount % 0.5 === 0) {
                return amount.toString();
            } else if (amount % 0.25 === 0) {
                return amount.toString();
            } else {
                return amount.toFixed(1);
            }
        }

        // Create recipe selector buttons organized by categories

        // Language switching function
        function switchLanguage(lang) {
            currentLanguage = lang;
           
            // Update language button states
            document.querySelectorAll('.language-btn').forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 bg-orange-500 text-white';
                } else {
                    btn.className = 'language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 text-gray-600 hover:bg-gray-100';
                }
            });

            // Update page direction
            const html = document.documentElement;
            if (lang === 'he') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', lang);
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', lang);
            }

            // Update all text elements
            updateLanguageTexts();
        }

        // Update all text elements based on current language
        function updateLanguageTexts() {
            const t = translations[currentLanguage];
           
            document.getElementById('recipe-title').textContent = t.recipe_title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('recipe-selector-title').textContent = t.recipe_selector_title;
            document.getElementById('serving-selector-title').textContent = t.serving_selector_title;
            document.getElementById('serving-label').textContent = t.serving_label;
            document.getElementById('ingredients-title').textContent = t.ingredients_title;
            document.getElementById('instructions-title').textContent = t.instructions_title;
            document.getElementById('shopping-list-title').textContent = t.shopping_list_title;
            document.getElementById('print-text').textContent = t.print_text;
            document.getElementById('copy-clipboard-text').textContent = t.copy_clipboard_text;
            document.getElementById('reset-text').textContent = t.reset_text;
           
            // Update preset buttons
            updatePresetButtons();
           
            // Update recipe selector
            updateRecipeSelector();
           
            // Update all content
            updateAll();
        }

        // Update preset buttons with current language
        function updatePresetButtons() {
            const t = translations[currentLanguage];
            const presetButtons = document.querySelectorAll('.preset-btn');
            presetButtons.forEach(btn => {
                const servings = btn.dataset.servings;
                btn.textContent = `${servings} ${t.servings_text}`;
            });
        }

        // Calculate scaled amount
        function scaleAmount(baseAmount, servings) {
            const scaleFactor = servings / 4;
            const scaledAmount = baseAmount * scaleFactor;
           
            // Round to reasonable precision
            if (scaledAmount < 1) {
                return Math.round(scaledAmount * 10) / 10;
            } else if (scaledAmount < 10) {
                return Math.round(scaledAmount * 4) / 4;
            } else {
                return Math.round(scaledAmount * 2) / 2;
            }
        }

        // Format amount for display
        function formatAmount(amount) {
            if (amount % 1 === 0) {
                return amount.toString();
            } else if (amount % 0.5 === 0) {
                return amount.toString();
            } else if (amount % 0.25 === 0) {
                return amount.toString();
            } else {
                return amount.toFixed(1);
            }
        }

        // Create recipe selector buttons organized by categories
        function createRecipeSelector() {
            const recipeSelector = document.getElementById('recipe-selector');
            recipeSelector.innerHTML = '';

            // Create categories
            Object.keys(recipeCategoryMap).forEach(categoryKey => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category-section';
               
                // Category title
                const categoryTitle = document.createElement('div');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = recipeCategories[currentLanguage][categoryKey];
                categoryDiv.appendChild(categoryTitle);
               
                // Recipe buttons grid
                const recipesGrid = document.createElement('div');
                recipesGrid.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3';
               
                recipeCategoryMap[categoryKey].forEach(recipeKey => {
                    const recipe = recipes[recipeKey];
                    
                    // Create container for recipe button and share button
                    const recipeContainer = document.createElement('div');
                    recipeContainer.className = 'relative group';
                    
                    const button = document.createElement('button');
                    button.className = `recipe-button w-full p-4 bg-white border-2 border-gray-200 rounded-lg text-center hover:border-orange-300 shadow-md hover:shadow-lg transition-all duration-200 ${recipeKey === currentRecipe ? 'border-orange-500 bg-orange-50' : ''}`;
                    button.innerHTML = `
                        <div class="text-3xl mb-2">${recipe.emoji}</div>
                        <div class="text-sm font-medium text-gray-700">${recipeTranslations[currentLanguage][recipeKey]}</div>
                    `;
                    button.addEventListener('click', () => {
                        currentRecipe = recipeKey;
                        updateRecipeSelector();
                        updateAll();
                    });
                    
                    // Create share button (top-left corner)
                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'absolute top-2 left-2 w-8 h-8 bg-blue-500 hover:bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg hover:shadow-xl opacity-0 group-hover:opacity-100 transition-all duration-200 transform hover:scale-110 z-20';
                    shareBtn.innerHTML = '🔗';
                    shareBtn.title = 'שתף מתכון';
                    shareBtn.style.fontSize = '0.875rem';
                    shareBtn.style.lineHeight = '1';
                    shareBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        copyShareLink(recipeKey);
                    });
                    
                    recipeContainer.appendChild(button);
                    recipeContainer.appendChild(shareBtn);
                    
                    recipesGrid.appendChild(recipeContainer);
                });
               
                categoryDiv.appendChild(recipesGrid);
                recipeSelector.appendChild(categoryDiv);
            });
        }

        // Update recipe selector active state
        function updateRecipeSelector() {
            // Recreate the entire selector to update language
            createRecipeSelector();
        }

        // Update ingredients display
        function updateIngredients() {
            const ingredientsList = document.getElementById('ingredients-list');
            ingredientsList.innerHTML = '';

            const recipe = recipes[currentRecipe];
            const ingredients = recipe.ingredients[currentLanguage] || recipe.ingredients.he;
           
            ingredients.forEach((ingredient, index) => {
                const scaledAmount = scaleAmount(ingredient.amount, currentServings);
                const ingredientDiv = document.createElement('div');
                ingredientDiv.className = 'ingredient-item flex justify-between items-center p-3 bg-gray-50 rounded-lg';
                ingredientDiv.innerHTML = `
                    <span class="font-medium text-gray-800">${ingredient.name}</span>
                    <span class="text-orange-600 font-semibold">${formatAmount(scaledAmount)} ${ingredient.unit}</span>
                `;
                ingredientDiv.classList.add('fade-in');
                ingredientsList.appendChild(ingredientDiv);
            });
        }

        // Update instructions display
        function updateInstructions() {
            const instructionsList = document.getElementById('instructions-list');
            instructionsList.innerHTML = '';

            const recipe = recipes[currentRecipe];
            const instructions = recipe.instructions[currentLanguage] || recipe.instructions.he;
           
            instructions.forEach((instruction, index) => {
                const instructionDiv = document.createElement('div');
                instructionDiv.className = 'instruction-item flex items-start p-3 bg-blue-50 rounded-lg';
                const marginClass = (currentLanguage === 'he') ? 'mr-3' : 'ml-3';
                instructionDiv.innerHTML = `
                    <span class="flex-shrink-0 w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center text-sm font-bold ${marginClass}">${index + 1}</span>
                    <span class="text-gray-800 leading-relaxed">${instruction}</span>
                `;
                instructionDiv.classList.add('fade-in');
                instructionsList.appendChild(instructionDiv);
            });
        }

        // Update shopping list
        function updateShoppingList() {
            const shoppingList = document.getElementById('shopping-list');
            shoppingList.innerHTML = '';

            const recipe = recipes[currentRecipe];
            const ingredients = recipe.ingredients[currentLanguage] || recipe.ingredients.he;
           
            // Group ingredients by category
            const categories = {};
            ingredients.forEach((ingredient, index) => {
                if (!categories[ingredient.category]) {
                    categories[ingredient.category] = [];
                }
                const scaledAmount = scaleAmount(ingredient.amount, currentServings);
                categories[ingredient.category].push({
                    name: ingredient.name,
                    amount: scaledAmount,
                    unit: ingredient.unit,
                    id: `item-${currentRecipe}-${index}`
                });
            });

            // Display by categories
            Object.keys(categories).forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-4';
               
                const categoryTitle = document.createElement('h3');
                categoryTitle.className = 'font-semibold text-gray-700 mb-2 text-lg border-b border-gray-200 pb-1';
                categoryTitle.textContent = category;
                categoryDiv.appendChild(categoryTitle);

                categories[category].forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'shopping-item flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-all duration-200';
                    const checkboxMargin = (currentLanguage === 'he') ? 'ml-3' : 'mr-3';
                    itemDiv.innerHTML = `
                        <input type="checkbox" id="${item.id}" class="${checkboxMargin} w-5 h-5 text-green-600 bg-gray-100 border-gray-300 rounded focus:ring-green-500 focus:ring-2 cursor-pointer">
                        <label for="${item.id}" class="flex-1 flex justify-between items-center cursor-pointer">
                            <span class="text-gray-800 font-medium">${item.name}</span>
                            <span class="text-orange-600 font-semibold">${formatAmount(item.amount)} ${item.unit}</span>
                        </label>
                    `;
                   
                    // Add checkbox functionality
                    const checkbox = itemDiv.querySelector('input[type="checkbox"]');
                    const label = itemDiv.querySelector('label');
                   
                    checkbox.addEventListener('change', function() {
                        if (this.checked) {
                            label.style.textDecoration = 'line-through';
                            label.style.opacity = '0.6';
                            itemDiv.style.backgroundColor = '#f0fdf4';
                            itemDiv.style.borderColor = '#22c55e';
                        } else {
                            label.style.textDecoration = 'none';
                            label.style.opacity = '1';
                            itemDiv.style.backgroundColor = '';
                            itemDiv.style.borderColor = '#d1d5db';
                        }
                    });
                   
                    categoryDiv.appendChild(itemDiv);
                });

                categoryDiv.classList.add('fade-in');
                shoppingList.appendChild(categoryDiv);
            });
        }

        // Update serving count display
        function updateServingDisplay() {
            document.getElementById('serving-count').textContent = currentServings;
        }

        // Update all displays
        function updateAll() {
            updateServingDisplay();
            updateIngredients();
            updateInstructions();
            updateShoppingList();
        }

        // Event listeners
        document.getElementById('decrease-btn').addEventListener('click', () => {
            if (currentServings > 1) {
                currentServings--;
                updateAll();
            }
        });

        document.getElementById('increase-btn').addEventListener('click', () => {
            if (currentServings < 20) {
                currentServings++;
                updateAll();
            }
        });

        // Preset buttons
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentServings = parseInt(btn.dataset.servings);
                updateAll();
            });
        });

        // Print functionality
        document.getElementById('print-btn').addEventListener('click', () => {
            const printWindow = window.open('', '_blank');
            const shoppingListContent = document.getElementById('shopping-list').innerHTML;
            const servingCount = document.getElementById('serving-count').textContent;
            const recipeName = recipeTranslations[currentLanguage][currentRecipe];
            const t = translations[currentLanguage];
            const direction = (currentLanguage === 'he') ? 'rtl' : 'ltr';
            const marginSide = (currentLanguage === 'he') ? 'margin-left' : 'margin-right';
           
            printWindow.document.write(`
                <html dir="${direction}">
                <head>
                    <title>${t.shopping_list_title} - ${recipeName}</title>

        // Copy shopping list to clipboard
        document.getElementById('copy-clipboard-btn').addEventListener('click', async () => {
            const recipeName = recipeTranslations[currentLanguage][currentRecipe] || currentRecipe;
            const servingCount = document.getElementById('serving-count').textContent;
            const t = translations[currentLanguage];
            
            // Build the shopping list text with checkboxes
            let clipboardText = `${recipeName} - ${servingCount} ${t.serving_label}\n${t.shopping_list_title}\n\n`;
            
            // Get all shopping list items
            const shoppingList = document.getElementById('shopping-list');
            const categories = shoppingList.querySelectorAll('.mb-4');
            
            categories.forEach(categoryDiv => {
                const categoryTitle = categoryDiv.querySelector('h3').textContent;
                clipboardText += `${categoryTitle}:\n`;
                
                const items = categoryDiv.querySelectorAll('.shopping-item');
                items.forEach(itemDiv => {
                    const checkbox = itemDiv.querySelector('input[type="checkbox"]');
                    const label = itemDiv.querySelector('label');
                    const itemName = label.querySelector('span:first-child').textContent;
                    const itemAmount = label.querySelector('span:last-child').textContent;
                    
                    // Use ☐ for unchecked, ☑ for checked
                    const checkboxSymbol = checkbox.checked ? '☑' : '☐';
                    clipboardText += `${checkboxSymbol} ${itemName} - ${itemAmount}\n`;
                });
                
                clipboardText += '\n';
            });
            
            // Copy to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(clipboardText);
                    showCopyNotification('הרשימה הועתקה ללוח!');
                } catch (err) {
                    fallbackCopyToClipboard(clipboardText);
                }
            } else {
                fallbackCopyToClipboard(clipboardText);
            }
        });

        // Fallback copy function
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyNotification('הרשימה הועתקה ללוח!');
                } else {
                    showCopyNotification('לא ניתן להעתיק. נסי להעתיק ידנית.', true);
                }
            } catch (err) {
                showCopyNotification('לא ניתן להעתיק. נסי להעתיק ידנית.', true);
            }
            
            document.body.removeChild(textArea);
        }

        // Show copy notification
        function showCopyNotification(message, isError = false) {
            const existing = document.getElementById('copy-notification');
            if (existing) {
                existing.remove();
            }

            const notification = document.createElement('div');
            notification.id = 'copy-notification';
            notification.className = `fixed top-4 left-1/2 transform -translate-x-1/2 bg-${isError ? 'red' : 'green'}-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in text-center`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Reset checkboxes functionality
        document.getElementById('reset-btn').addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('#shopping-list input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    checkbox.checked = false;
                    checkbox.dispatchEvent(new Event('change'));
                }
            });
        });

        // Copy share link to clipboard
        function copyShareLink(recipeKey) {
            const shareUrl = `${window.location.origin}/recipe/${recipeKey}`;
            
            // Try to use modern clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showShareNotification('הקישור הועתק ללוח!');
                }).catch(() => {
                    fallbackCopyTextToClipboard(shareUrl);
                });
            } else {
                fallbackCopyTextToClipboard(shareUrl);
            }
        }

        // Fallback for older browsers
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showShareNotification('הקישור הועתק ללוח!');
                } else {
                    showShareNotification('לא ניתן להעתיק. הקישור: ' + text, true);
                }
            } catch (err) {
                showShareNotification('לא ניתן להעתיק. הקישור: ' + text, true);
            }
            
            document.body.removeChild(textArea);
        }

        // Show notification
        function showShareNotification(message, isError = false) {
            // Remove existing notification if any
            const existing = document.getElementById('share-notification');
            if (existing) {
                existing.remove();
            }

            const notification = document.createElement('div');
            notification.id = 'share-notification';
            notification.className = `fixed top-4 left-1/2 transform -translate-x-1/2 bg-${isError ? 'red' : 'green'}-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // Language button event listeners
        document.querySelectorAll('.language-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchLanguage(btn.dataset.lang);
            });
        });

        // Initialize the app
        // Load recipes when page loads
        loadRecipes();
    </script>
