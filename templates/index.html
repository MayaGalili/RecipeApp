<!doctype html>
<html lang="he" dir="rtl" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ספר המתכונים שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="min-h-full">
  <!-- Top bar -->
  <header class="site-header">
    <div class="site-header-inner">
      <a href="#top" class="brand" aria-label="Home">
        <svg class="brand-hat" viewBox="0 0 48 44" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 30c-5.5-1-9-5-9-9.5 0-4.6 3.6-8 8-8 .5 0 1 0 1.5.1C16 7.5 19.8 4.5 24.5 4.5c4.8 0 8.6 3 9.8 7.2 4.5.4 8 4 8 8.4 0 4.8-3.8 8.6-8.8 9.4"/><path d="M14 30v8.5c0 1.4 1.1 2.5 2.5 2.5h15c1.4 0 2.5-1.1 2.5-2.5V30"/><path d="M14 35.5h19"/></svg>
        <span class="brand-text"><span id="brand-name">ספר המתכונים שלי</span><svg class="swoosh" viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7C50 2 130 1 198 5" fill="none" stroke="#6b9a2b" stroke-width="2.6" stroke-linecap="round"/></svg></span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="#recipe-selector-section" class="nav-link" id="nav-all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
          <span id="nav-all-text">כל המתכונים</span>
        </a>
        <a href="#selected-recipes-panel" class="nav-link" id="nav-plan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.5h17M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 17.5h.01M12 17.5h.01"/></svg>
          <span id="nav-plan-text">תכנון ארוחות</span>
        </a>
      </nav>
      <div class="header-tools">
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="lang-he" class="language-btn is-active" data-lang="he" aria-pressed="true">עברית</button>
          <span class="lang-sep" aria-hidden="true"></span>
          <button id="lang-en" class="language-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a href="{{ url_for('manage') }}" id="manage-recipes-btn" class="user-link" title="ניהול מתכונים" aria-label="ניהול מתכונים">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero with title and search -->
  <section class="hero" id="top">
    <div class="hero-inner">
      <div class="hero-title-wrap">
        <svg class="hero-heart" viewBox="0 0 40 40" fill="none" stroke="#d9291c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 35C8 26 4 19 5.5 13.5 7 8 13.5 6 17.5 10.5c1.2 1.4 2 2.6 2.5 3.5.5-.9 1.3-2.1 2.5-3.5C26.5 6 33 8 34.5 13.5 36 19 32 26 20 35z" transform="rotate(-14 20 20)"/></svg>
        <h1 id="recipe-title">ספר המתכונים שלי</h1>
        <svg class="swoosh" viewBox="0 0 260 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7C60 2 190 1 258 5" fill="none" stroke="#6b9a2b" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <p id="subtitle">מתכונים אהובים, בריאים וקלים להכנה</p>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input type="search" id="recipe-search" class="search-input" placeholder="חיפוש מתכון..." aria-label="חיפוש מתכון..." autocomplete="off">
      </div>
    </div>
  </section>

  <main class="page-main">
    <!-- Recipe Selector -->
    <section id="recipe-selector-section" class="selector-section">
      <h2 id="recipe-selector-title" class="sr-only">בחר מתכון</h2>
      <div id="recipe-selector"><!-- Recipe categories will be populated by JavaScript -->
      </div>
    </section>

    <div class="details-column">
      <!-- Selected Recipes -->
      <div id="selected-recipes-panel" class="panel">
        <h2 id="selected-recipes-title" class="panel-title text-center">מתכונים שנבחרו</h2>
        <p id="selected-recipes-empty" class="text-center text-gray-500 mb-4">סמנו מתכונים כדי להוסיף אותם לרשימת הקניות</p>
        <div id="selected-recipes-list" class="space-y-2 mb-4"><!-- Selected recipes will be populated by JavaScript -->
        </div>
        <div class="flex gap-3 flex-wrap">
          <button id="generate-list-btn" class="btn btn-primary" disabled>
            <span id="generate-list-text">🛒 צור רשימת קניות</span>
          </button>
          <button id="clear-selection-btn" class="btn btn-secondary" disabled>
            <span id="clear-selection-text">🗑️ נקה בחירה</span>
          </button>
        </div>
      </div><!-- Recipe Ingredients -->
      <div class="panel">
        <h2 id="ingredients-title" class="panel-title mb-6">מרכיבי המתכון</h2>
        <div id="ingredients-list" class="space-y-3"><!-- Ingredients will be populated by JavaScript -->
        </div>
      </div><!-- Recipe Instructions -->
      <div class="panel">
        <h2 id="instructions-title" class="panel-title mb-6">הוראות הכנה</h2>
        <div id="instructions-list" class="space-y-3"><!-- Instructions will be populated by JavaScript -->
        </div>
      </div><!-- Shopping List -->
      <div id="shopping-list-card" class="panel" style="display: none;">
        <h2 id="shopping-list-title" class="panel-title mb-6">רשימת קניות</h2>
        <div id="shopping-list" class="space-y-2"><!-- Shopping list will be populated by JavaScript -->
        </div>
        <div class="mt-6 flex gap-3 flex-wrap">
          <button id="print-btn" class="btn btn-secondary">
            <span id="print-text">🖨️ הדפס רשימת קניות</span>
          </button>
          <button id="copy-clipboard-btn" class="btn btn-primary">
            <span id="copy-clipboard-text">📋 העתק ללוח</span>
          </button>
          <button id="reset-btn" class="btn btn-secondary">
            <span id="reset-text">🔄 איפוס סימונים</span>
          </button>
        </div>
      </div>
    </div>
  </main>
  <script>
    // Server-generated URLs for the scripts below
    window.APP_CONFIG = {
      recipes: {{ url_for("serve_recipes")|tojson }},
      categoryImages: {{ url_for("static", filename="img/categories/")|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/index-i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shopping-list-aggregate.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-recipe-view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-multi-recipe.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-actions.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-share.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index-init.js') }}"></script>

</html>
