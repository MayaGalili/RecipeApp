  <style>
        body {
            box-sizing: border-box;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
       
        .ingredient-item {
            transition: all 0.2s ease;
        }
       
        .ingredient-item:hover {
            transform: translateX(-2px);
        }
       
        .serving-button {
            transition: all 0.2s ease;
        }
       
        .serving-button:hover {
            transform: scale(1.05);
        }
       
        .recipe-button {
            transition: all 0.2s ease;
        }
       
        .recipe-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
       
        .recipe-button.active {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            transform: scale(1.02);
        }
       
        .shopping-item {
            transition: all 0.2s ease;
        }
       
        .shopping-item:hover {
            background-color: #f8fafc;
        }
       
        .category-section {
            margin-bottom: 2rem;
        }
       
        .category-title {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }
       
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
       
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fall {
            from {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .falling-emoji {
            position: fixed;
            font-size: 3rem;
            pointer-events: none;
            z-index: 9999;
            animation: fall 3s linear forwards;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

            } else if (scaledAmount < 10) {
                return Math.round(scaledAmount * 4) / 4;
            } else {
                return Math.round(scaledAmount * 2) / 2;
            }
        }

        // Update ingredients display


        // Parse ingredients from textarea
        function parseIngredients(text, lang) {
            if (!text.trim()) return [];
            const lines = text.split('\n').filter(line => line.trim());
            return lines.map(line => {
                const parts = line.split(',').map(p => p.trim());
                if (parts.length >= 4) {
                    return {
                        name: parts[0],
                        amount: parseFloat(parts[1]),
                        unit: parts[2],
                        category: parts[3]
                    };
                }
                return null;
            }).filter(item => item !== null);
        }

        // Parse instructions from textarea
        function parseInstructions(text) {
            if (!text.trim()) return [];
            return text.split('\n').filter(line => line.trim());
        }

        // Generate recipe key from English name
        function generateRecipeKey(recipeNameEn) {
            if (!recipeNameEn) return '';
            
            // Convert to lowercase, replace spaces and special chars with underscores
            let key = recipeNameEn
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s]/g, '') // Remove special characters
                .replace(/\s+/g, '_') // Replace spaces with underscores
                .replace(/_+/g, '_') // Replace multiple underscores with single
                .replace(/^_|_$/g, ''); // Remove leading/trailing underscores
            
            // If key is empty, use a default
            if (!key) {
                key = 'recipe';
            }
            
            // Check if key already exists, if so add a number suffix
            let finalKey = key;
            let counter = 1;
            while (recipes[finalKey]) {
                finalKey = `${key}_${counter}`;
                counter++;
            }
            
            return finalKey;
        }

            const ingredientsHe = parseIngredients(document.getElementById('ingredients-he').value, 'he');
            const ingredientsEn = parseIngredients(document.getElementById('ingredients-en').value, 'en');
            const instructionsHe = parseInstructions(document.getElementById('instructions-he').value);
            const instructionsEn = parseInstructions(document.getElementById('instructions-en').value);

            // Validate
            if (!recipeNameHe || !recipeNameEn || !emoji || !category) {
                showFormMessage(translations[currentLanguage].validation_required, 'error');
                return;
            }

            // Generate recipe key automatically (only for new recipes)
            let recipeKey;
            if (editingRecipeKey) {
                recipeKey = editingRecipeKey;
            } else {
                recipeKey = generateRecipeKey(recipeNameEn);
            }

            if (ingredientsHe.length === 0 || ingredientsEn.length === 0) {
                showFormMessage(translations[currentLanguage].validation_ingredients, 'error');
                return;

            // Create recipe object

                ingredients: {
                    he: ingredientsHe,
                    en: ingredientsEn
                },
                instructions: {
                    he: instructionsHe,
                    en: instructionsEn
                }
            };

            // Send to server
            try {
                const endpoint = editingRecipeKey ? API_ENDPOINTS.updateRecipe : API_ENDPOINTS.addRecipe;
                const method = editingRecipeKey ? 'PUT' : 'POST';
                
                const response = await fetch(endpoint, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipeKey: recipeKey,
                        recipe: newRecipe,
                        category: category,
                        translations: {
                            he: recipeNameHe,
                            en: recipeNameEn

            const recipeNameEn = recipeTranslations['en'][recipeKey] || '';

        async function parseFreeTextRecipe() {
            const freeText = document.getElementById('free-text-recipe').value.trim();
            const parseBtn = document.getElementById('parse-recipe-btn');
            const parseBtnText = document.getElementById('parse-btn-text');
            const parseBtnLoading = document.getElementById('parse-btn-loading');
            const parseResult = document.getElementById('parse-result');
            const parseError = document.getElementById('parse-error');
            const parsePreview = document.getElementById('parse-preview');
            
            // Hide previous results
            parseResult.classList.add('hidden');
            parseError.classList.add('hidden');
            
            const t = translations[currentLanguage];
            
            if (!freeText) {
                parseError.textContent = t.parse_error_empty;
                parseError.classList.remove('hidden');
                return;
            }
            
            // Show loading state
            parseBtn.disabled = true;
            parseBtnText.classList.add('hidden');
            parseBtnLoading.classList.remove('hidden');
            
            try {
                const response = await fetch('{{ url_for("parse_recipe") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ freeText: freeText })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'שגיאה בפרסור המתכון');
                }
                
                // Store parsed data
                parsedRecipeData = data.parsedRecipe;
                
                // Display preview
                const t = translations[currentLanguage];
                const notRecognized = t.not_recognized;
                let previewHtml = `<div class="space-y-2">`;
                previewHtml += `<p><strong>${t.parse_name_he}</strong> ${data.parsedRecipe.nameHe || notRecognized}</p>`;
                previewHtml += `<p><strong>${t.parse_name_en}</strong> ${data.parsedRecipe.nameEn || notRecognized}</p>`;
                previewHtml += `<p><strong>${t.parse_category}</strong> ${data.parsedRecipe.category || notRecognized}</p>`;
                previewHtml += `<p><strong>${t.parse_emoji}</strong> ${data.parsedRecipe.emoji || notRecognized}</p>`;
                previewHtml += `<p><strong>${t.parse_ingredients_count}</strong> ${data.parsedRecipe.ingredientsHe?.length || 0} (עברית), ${data.parsedRecipe.ingredientsEn?.length || 0} (אנגלית)</p>`;
                previewHtml += `<p><strong>${t.parse_steps_count}</strong> ${data.parsedRecipe.instructionsHe?.length || 0} (עברית), ${data.parsedRecipe.instructionsEn?.length || 0} (אנגלית)</p>`;
                previewHtml += `</div>`;
                
                parsePreview.innerHTML = previewHtml;
                parseResult.classList.remove('hidden');
                
            } catch (error) {
                const t = translations[currentLanguage];
                parseError.textContent = t.parse_error.replace('{error}', error.message);
                parseError.classList.remove('hidden');
            } finally {
                // Reset loading state
                parseBtn.disabled = false;
                parseBtnText.classList.remove('hidden');
                parseBtnLoading.classList.add('hidden');
            }
        }
        
        // Approve parsed recipe and fill form
        function approveParsedRecipe() {
            if (!parsedRecipeData) {
                return;
            }
            
            // Fill form fields
            document.getElementById('recipe-name-he').value = parsedRecipeData.nameHe || '';
            document.getElementById('recipe-name-en').value = parsedRecipeData.nameEn || '';
            document.getElementById('recipe-emoji').value = parsedRecipeData.emoji || '🍳';
            document.getElementById('recipe-category').value = parsedRecipeData.category || 'meat_fish';
            
            // Fill ingredients
            if (parsedRecipeData.ingredientsHe && parsedRecipeData.ingredientsHe.length > 0) {
                const ingredientsHeText = parsedRecipeData.ingredientsHe.map(ing => 
                    `${ing.name}, ${ing.amount}, ${ing.unit}, ${ing.category}`
                ).join('\n');
                document.getElementById('ingredients-he').value = ingredientsHeText;
            }
            
            if (parsedRecipeData.ingredientsEn && parsedRecipeData.ingredientsEn.length > 0) {
                const ingredientsEnText = parsedRecipeData.ingredientsEn.map(ing => 
                    `${ing.name}, ${ing.amount}, ${ing.unit}, ${ing.category}`
                ).join('\n');
                document.getElementById('ingredients-en').value = ingredientsEnText;
            }
            
            // Fill instructions
            if (parsedRecipeData.instructionsHe && parsedRecipeData.instructionsHe.length > 0) {
                document.getElementById('instructions-he').value = parsedRecipeData.instructionsHe.join('\n');
            }
            
            if (parsedRecipeData.instructionsEn && parsedRecipeData.instructionsEn.length > 0) {
                document.getElementById('instructions-en').value = parsedRecipeData.instructionsEn.join('\n');
            }
            
            // Show form and hide parse result
            document.getElementById('add-recipe-form').classList.remove('hidden');
            document.getElementById('parse-result').classList.add('hidden');
            document.getElementById('free-text-recipe').value = '';
            parsedRecipeData = null;
            
            // Scroll to form
            document.getElementById('add-recipe-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Reject parsed recipe
        function rejectParsedRecipe() {
            document.getElementById('parse-result').classList.add('hidden');
            parsedRecipeData = null;
        }

        // Initialize form event listeners
        function initializeFormListeners() {
            const toggleBtn = document.getElementById('toggle-form-btn');
            const cancelBtn = document.getElementById('cancel-form-btn');
            const recipeForm = document.getElementById('recipe-form');
            const parseBtn = document.getElementById('parse-recipe-btn');
            const approveBtn = document.getElementById('approve-parse-btn');
            const rejectBtn = document.getElementById('reject-parse-btn');
            const freeTextArea = document.getElementById('free-text-recipe');
            
            if (parseBtn) {
                parseBtn.addEventListener('click', parseFreeTextRecipe);
            }
            
            // Allow Enter+Shift to submit, or just Enter if text is long enough
            if (freeTextArea) {
                freeTextArea.addEventListener('keydown', (e) => {
                    // Ctrl+Enter or Cmd+Enter to parse
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        parseFreeTextRecipe();
                    }
                });
            }
            
            if (approveBtn) {
                approveBtn.addEventListener('click', approveParsedRecipe);
            }
            if (rejectBtn) {
                rejectBtn.addEventListener('click', rejectParsedRecipe);
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleForm);
            }
            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    document.getElementById('add-recipe-form').classList.add('hidden');
                    document.getElementById('recipe-form').reset();
                    document.getElementById('form-message').classList.add('hidden');
                    editingRecipeKey = null;
                    // Update form title back to "Add Recipe"
                    const formTitle = document.getElementById('add-recipe-title');
                    formTitle.textContent = translations[currentLanguage].add_recipe_title;
                });
            }
            if (recipeForm) {
                recipeForm.addEventListener('submit', handleRecipeSubmit);
            }
        }

        // Language button event listeners
        document.querySelectorAll('.language-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchLanguage(btn.dataset.lang);
            });
        });

        // Copy share link to clipboard
        function copyShareLink(recipeKey) {
            const shareUrl = `${window.location.origin}/recipe/${recipeKey}`;
            
            // Try to use modern clipboard API
            const t = translations[currentLanguage];
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showShareNotification(t.link_copied);
                }).catch(() => {
                    fallbackCopyTextToClipboard(shareUrl);
                });
            } else {
                fallbackCopyTextToClipboard(shareUrl);
            }
        }

        // Fallback for older browsers
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            const t = translations[currentLanguage];
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showShareNotification(t.link_copied);
                } else {
                    showShareNotification(t.link_copy_error.replace('{link}', text), true);
                }
            } catch (err) {
                showShareNotification(t.link_copy_error.replace('{link}', text), true);
            }
            
            document.body.removeChild(textArea);
        }

        // Show notification
        function showShareNotification(message, isError = false) {
            // Remove existing notification if any
            const existing = document.getElementById('share-notification');
            if (existing) {
                existing.remove();
            }

            const notification = document.createElement('div');
            notification.id = 'share-notification';
            notification.className = `fixed top-4 left-1/2 transform -translate-x-1/2 bg-${isError ? 'red' : 'green'}-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // Initialize the app
        // Initialize form listeners first (they need to be available)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initializeFormListeners();
                loadRecipes();
            });
        } else {
            initializeFormListeners();
            loadRecipes();
        }
    </script>
