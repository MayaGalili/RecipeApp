<!doctype html>
<html lang="he" dir="rtl" style="height: 100%;">
<head>

  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>מתכונים ונהנים</title>
  <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">

<body class="min-h-full bg-gradient-to-br from-orange-50 to-red-50">
  <div class="container mx-auto px-4 py-8 max-w-4xl"><!-- Language Selector -->
   <div class="text-center mb-6">
    <div class="inline-flex bg-white rounded-lg shadow-md p-1"><button id="lang-he" class="language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 bg-orange-500 text-white" data-lang="he">עברית</button> <button id="lang-en" class="language-btn px-4 py-2 rounded-md font-medium transition-all duration-200 text-gray-600 hover:bg-gray-100" data-lang="en">English</button>
    </div>
   </div><!-- Header -->
   <div class="text-center mb-8">
    <h1 id="recipe-title" class="text-4xl font-bold text-gray-800 mb-2">מתכונים ונהנים</h1>
    <p id="subtitle" class="text-gray-600 text-lg">בחר מתכון ומספר מנות וקבל רשימת קניות מותאמת</p>
   </div><!-- Navigation to Home Page -->
   <div class="text-center mb-6">
    <a href="{{ url_for('index') }}" id="back-to-home" class="inline-block bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 shadow-md">← חזרה לדף הראשי</a>
    <form method="post" action="{{ url_for('logout') }}" class="inline-block">
     <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
     <button type="submit" id="logout-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition-all duration-200 shadow-md">התנתקות</button>
    </form>
   </div><!-- Recipe Selector -->

    <div id="recipe-selector"><!-- Recipe categories will be populated by JavaScript -->
    </div>
   </div><!-- Free Text Recipe Parser -->
   <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
    <h2 id="free-text-title" class="text-2xl font-semibold text-gray-800 mb-4 text-center">הוסף מתכון מטקסט חופשי</h2>
    <p id="free-text-desc" class="text-sm text-gray-600 mb-4 text-center">הדבק או הקלד מתכון בשפה חופשית, והמערכת תמיר אותו למבנה המתכון</p>
    <div class="space-y-4">
     <div>
      <label id="free-text-label" class="block text-sm font-medium text-gray-700 mb-2">הדבק כאן את המתכון (עברית או אנגלית)</label>
      <textarea id="free-text-recipe" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500" rows="8" placeholder="לדוגמה:&#10;מרק אפונה&#10;&#10;מצרכים:&#10;שתי כוסות אפונה יבשה&#10;שמונה כוסות מים&#10;1 בצל חתוך לרבעים&#10;...&#10;&#10;אופן ההכנה:&#10;לטגן היטב את הבצל בסיר עמוק&#10;להוסיף את האפונה ולקצת לטגן&#10;..."></textarea>
     </div>
     <button id="parse-recipe-btn" type="button" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 mb-4 shadow-md hover:shadow-lg">
      <span id="parse-btn-text">🤖 פרסם מתכון עם AI</span>
      <span id="parse-btn-loading" class="hidden">⏳ מעבד...</span>
     </button>
     <div id="parse-error" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 text-red-700"></div>
    </div>
   </div><!-- Add Recipe Form -->
   <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
